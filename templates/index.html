<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Nocturna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            color: #fbbf24;
            letter-spacing: 1px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .header p {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            border-color: #fbbf24;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .helper-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 25px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 15px;
            display: none;
        }

        .result-box h3 {
            font-size: 13px;
            color: #fbbf24;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .result-box p {
            font-size: 14px;
            color: #e5e7eb;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Biblioteca Nocturna</h1>
            <p>Gestión de devoluciones y cálculo automático de multas</p>
        </div>

        <div class="form-group">
            <label for="libro">Seleccione un libro:</label>
            <select id="libro">
                {% for libro in libros %}
                    <!-- Filtro aplicado para quitar guiones bajos y poner mayúsculas -->
                    <option value="{{ loop.index0 }}">{{ loop.index }}. {{ libro | replace('_', ' ') | title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="hora">Hora (Formato 24h):</label>
                <input type="number" id="hora" min="0" max="23" value="21">
                <div class="helper-text">Ej: 21 (para las 9 PM)</div>
            </div>
            <div class="form-group">
                <label for="minutos">Minutos:</label>
                <input type="number" id="minutos" min="0" max="59" value="0">
            </div>
        </div>

        <button onclick="procesarDevolucion()">Procesar Devolución</button>

        <div id="resultadoBox" class="result-box">
            <h3>Resultado del sistema:</h3>
            <p id="resLibro"></p>
            <p id="resMensaje"></p>
        </div>
    </div>

    <script>
        function procesarDevolucion() {
            const indice_libro = document.getElementById('libro').value;
            const hora = document.getElementById('hora').value;
            const minutos = document.getElementById('minutos').value;

            fetch('/api/calcular', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    indice_libro: indice_libro,
                    hora: hora,
                    minutos: minutos
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const box = document.getElementById('resultadoBox');
                    box.style.display = 'block';
                    
                    // Limpia los guiones del nombre del libro también visualmente
                    const nombreLimpio = data.libro.replace(/_/g, ' ').toUpperCase();
                    
                    document.getElementById('resLibro').innerText = `Libro: ${nombreLimpio}`;
                    document.getElementById('resMensaje').innerText = data.resultado;
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
